name: Generate and publish blog posts

on:
  schedule:
    # 07:00 in Spain during daylight saving time (CEST, UTC+2).
    - cron: "0 5 * * *"
    # 22:45 in Spain during daylight saving time (CEST, UTC+2).
    - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Publication slot"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish next queued post
        env:
          BLOG_AUTO_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '45 20 * * *' && 'evening' || 'morning') }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run blog:publish:queued

      - name: Commit published post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/queue posts/daily public/blog
          git diff --cached --quiet || git commit -m "Add daily blog post"
          git pull --rebase origin main
          git push
